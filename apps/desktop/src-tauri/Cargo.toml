[package]
name = "retune-desktop"
version = "0.3.0"
description = "Retune desktop shell — iTunes-style Spotify wrapper with local metadata overlay"
license.workspace = true
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "retune_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
dev-token-store = []

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22"
retune-audio = { path = "../../../crates/retune-audio" }
retune-core = { path = "../../../crates/retune-core" }
retune-spotify = { path = "../../../crates/retune-spotify" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
souvlaki = "0.8"
flate2 = "1"
chrono = "0.4"
log = "0.4"
md-5 = "0.10"
librespot-audio = { version = "0.8", default-features = false }
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-protocol = { version = "0.8", default-features = false }
librespot-playback = { version = "0.8", default-features = false, features = ["rodio-backend", "rustls-tls-native-roots"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rodio = { version = "0.21.1", default-features = false, features = ["playback"] }
rand = "0.9"
url = "2"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2"
