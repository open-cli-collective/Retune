[workspace]
resolver = "2"
members = [
    "crates/retune-audio",
    "crates/retune-core",
    "crates/retune-spotify",
    "apps/desktop/src-tauri",
]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[patch.crates-io]
librespot-core = { git = "https://github.com/rianjs/librespot", branch = "retune-0.8" }
librespot-playback = { git = "https://github.com/rianjs/librespot", branch = "retune-0.8" }
librespot-audio = { git = "https://github.com/rianjs/librespot", branch = "retune-0.8" }
librespot-metadata = { git = "https://github.com/rianjs/librespot", branch = "retune-0.8" }
librespot-protocol = { git = "https://github.com/rianjs/librespot", branch = "retune-0.8" }
librespot-oauth = { git = "https://github.com/rianjs/librespot", branch = "retune-0.8" }
