name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: open-cli-collective/.github/actions/pr-title@74d24fcd862d7b9cbe8f6fdda31db6a833e3d706
        with:
          title: ${{ github.event.pull_request.title }}

  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  frontend:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: node ../../scripts/check-release.mjs
      - run: node ../../scripts/check-docs.mjs
      - run: node ../../scripts/check-tauri-acl.mjs
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run build

  native-bundles:
    name: Native ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            arch: arm64
            bundle: app
            output: macos
          - name: Windows x64
            os: windows-2025
            arch: x64
            bundle: nsis
            output: nsis
          - name: Windows ARM64
            os: windows-11-arm
            arch: arm64
            bundle: nsis
            output: nsis
          - name: Ubuntu 22.04 amd64
            os: ubuntu-22.04
            arch: x64
            bundle: deb
            output: deb
          - name: Ubuntu 22.04 arm64
            os: ubuntu-22.04-arm
            arch: arm64
            bundle: deb
            output: deb
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Verify native runner architecture
        run: node -e "if (process.arch !== '${{ matrix.arch }}') { throw new Error('expected ${{ matrix.arch }}, got ' + process.arch) }"

      - name: Install Ubuntu build dependencies
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            wget

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Validate stable runtime contracts
        working-directory: apps/desktop
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const config = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            if (config.identifier !== 'com.rianjs.retune') throw new Error('bundle identifier changed');
          "

      - name: Release native credential-store tests
        run: cargo test --workspace --release --locked

      - name: Build native bundle
        working-directory: apps/desktop
        run: npx tauri build --bundles ${{ matrix.bundle }}

      - name: Verify native bundle output
        working-directory: apps/desktop
        run: |
          node -e "const fs = require('node:fs'); const path = '../../target/release/bundle/${{ matrix.output }}'; const suffix = { app: '.app', nsis: '.exe', deb: '.deb' }['${{ matrix.bundle }}']; const entries = fs.existsSync(path) ? fs.readdirSync(path) : []; if (!entries.some(entry => entry.endsWith(suffix))) throw new Error('missing ' + suffix + ' bundle in ' + path)"
